[project]
name = "vision"
version = "0.1.0"
description = "Offline BabyVision data export and batched Qwen VLM evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.9,<2",
    "flash-attn==2.8.3+cu130torch2.14",
    "huggingface-hub>=1.30,<2",
    "httpx>=0.28,<1",
    "filelock>=3.18,<4",
    "pillow>=11",
    "pyarrow>=21",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "tqdm>=4.67,<5",
    "transformers>=5.2,<6",
    "flash-linear-attention[cuda]==0.5.2",
    "markdown-it-py>=4,<5",
    "matplotlib>=3.10,<4",
]

[tool.uv]
# Never build CUDA extension source distributions on the shared server.
no-build-package = ["flash-attn", "causal-conv1d"]

[tool.uv.sources]
# Prebuilt for CPython 3.12, Linux x86_64, CUDA 13.0, and PyTorch 2.14.
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.10.0/flash_attn-2.8.3%2Bcu130torch2.14-cp312-cp312-linux_x86_64.whl" }
