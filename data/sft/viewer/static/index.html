<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visual Reasoning · 数据审核</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand"><span class="brand-icon">▧</span><div>Visual Reasoning<span class="subtitle">SFT 数据审核工作台</span></div></div><div class="header-note">图像 · 观察 · 推理</div></header>
<main><nav><div class="dataset-picker"><label for="dataset">数据集</label><select id="dataset" aria-label="选择数据集"></select></div><div class="navigation"><button id="previous" aria-label="上一个样本" title="上一个样本（←）">←</button><span id="position">— / —</span><button id="next" aria-label="下一个样本" title="下一个样本（→）">→</button></div><form id="search-form"><input id="search" placeholder="输入完整 sample_id 跳转" aria-label="搜索 sample_id"><button type="submit">查找 <span>↗</span></button></form></nav>
<div id="error" role="alert" hidden></div><div class="workspace"><section class="image-panel"><div class="panel-heading"><div><span class="eyebrow">VISUAL EVIDENCE</span><h1>原始图像</h1></div><span id="image-size" class="badge"></span></div><div id="stage"><div id="image-wrap"><img id="source-image" alt="当前样本的原图"><svg id="overlay" aria-label="观察窗口及引用关系"></svg></div><div id="image-error" hidden></div></div><div class="legend"><span><i class="green"></i>前一窗口 → 当前窗口</span><span><i class="red"></i>当前窗口 → 参考窗口</span></div><div id="window-info">将光标移到右侧绿色窗口标记，查看观察位置和引用关系。</div><div class="image-footer"><span id="image-path"></span><button id="clear-window">清除选中</button></div></section>
<section class="details-panel"><div class="sample-heading"><span class="eyebrow">SAMPLE INSPECTOR</span><span id="quality" class="badge"></span><h2 id="question"></h2><div id="sample-id"></div><div class="answer"><span>最终答案</span><strong id="answer"></strong></div></div>
<div class="trajectory-card"><div class="trajectory-heading"><h3>Interleaved</h3><span>视觉 + 自然语言</span></div><div id="interleaved" class="trajectory"></div></div>
<div class="trajectory-card"><div class="trajectory-heading"><h3>Visual only</h3><span>纯视觉观察</span></div><div id="visual_only" class="trajectory"></div></div>
<div class="fields-heading"><h3>样本字段</h3><select id="field-mode" aria-label="字段所属模式"></select><button id="download">下载 JSON</button></div><table id="fields"><tbody></tbody></table></section></div></main><script src="/app.js"></script></body></html>
